name: Auto Commit

on:
  schedule:
    # Chạy mỗi 8 tiếng vào phút thứ 17 lẻ (giảm tải hàng đợi của GitHub Actions)
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update log.txt
        run: |
          export TZ=Asia/Ho_Chi_Minh
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          echo "[$TIMESTAMP] Auto commit" >> log.txt

      - name: Commit and Push
        run: |
          git config --global user.name "trongnp0706"
          git config --global user.email "phuoctrong1001@gmail.com"
          git add log.txt
          
          # Chỉ commit nếu có thay đổi thực sự
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto commit at $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
